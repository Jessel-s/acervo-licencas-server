name: Deploy Edge Functions (Supabase)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.101.0

      - name: Verificar credencial de deploy Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Credencial Supabase ausente::Configure SUPABASE_ACCESS_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Validar acesso ao projeto Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: knasgssawkkiwmeyjhhb
        run: |
          set -euo pipefail
          if ! project_list="$(supabase projects list --output json 2>/dev/null)"; then
            echo "::error title=Supabase access token invalid::SUPABASE_ACCESS_TOKEN exists but cannot access Supabase. Create a new personal access token and update the GitHub Actions secret."
            exit 1
          fi
          if ! printf '%s' "$project_list" | grep -q "$SUPABASE_PROJECT_ID"; then
            echo "::error title=Supabase project access missing::The Supabase token does not list project $SUPABASE_PROJECT_ID. Grant access to that project or update the GitHub Actions secret."
            exit 1
          fi

      - name: Deploy sincronizar-operacoes (device license auth)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: knasgssawkkiwmeyjhhb
        run: supabase functions deploy sincronizar-operacoes --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy criar-cliente
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: knasgssawkkiwmeyjhhb
        run: supabase functions deploy criar-cliente --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy validar-licenca
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: knasgssawkkiwmeyjhhb
        run: supabase functions deploy validar-licenca --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy webhook-pagamento
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: knasgssawkkiwmeyjhhb
        run: supabase functions deploy webhook-pagamento --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy gerenciar-clientes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: knasgssawkkiwmeyjhhb
        run: supabase functions deploy gerenciar-clientes --project-ref "$SUPABASE_PROJECT_ID"
