<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Cliente</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; color: #333; margin: 20px; }
        form { background: white; padding: 20px; border-radius: 8px; max-width: 500px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], input[type="email"] { width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 4px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn { background-color: #0056b3; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Cadastrar Novo Cliente</h1>
    <p>Após o cadastro, uma Chave de Compra será gerada para você enviar ao cliente.</p>

    <form method="POST">
        <div>
            <label for="nome">Nome do Cliente:</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        <div>
            <label for="email">E-mail do Cliente:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" class="btn">Cadastrar e Gerar Chave</button>
    </form>
</body>
</html>
